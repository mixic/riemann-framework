[project]
name = "riemann-framework"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mpmath>=1.3.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `riemann_framework` importable without installing the package, so the
# suite runs both as `pytest python/tests` from the repository root and as
# `pytest tests` from this directory.
pythonpath = ["."]