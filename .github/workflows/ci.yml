name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r python/requirements.txt
      # The whole suite, not just the numerical core. Running only
      # `test_numeric_zeros.py` (2 of 434 tests) is what let a module-level
      # import error in `dsin.py` go unnoticed. The Lean assertions inside
      # `tests/test_formal_proof.py` skip here, because this job installs no
      # Lean toolchain; the `lean-build` job below covers Lean itself.
      - name: Run test suite
        working-directory: python
        run: pytest tests/ -v

  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in `lean-toolchain`, caches `.lake`, and
      # fetches the Mathlib olean cache (`lake exe cache get`) because this
      # package depends on Mathlib. Without the Mathlib cache this job would
      # compile Mathlib from source.
      - name: Build Lean library
        uses: leanprover/lean-action@v1
        with:
          build: "true"
          use-mathlib-cache: "auto"
          build-args: "--wfail"
