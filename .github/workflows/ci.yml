name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r python/requirements.txt
      - name: Run numerical tests
        working-directory: python
        run: pytest tests/test_numeric_zeros.py -v

  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in `lean-toolchain`, caches `.lake`, and
      # fetches the Mathlib olean cache (`lake exe cache get`) because this
      # package depends on Mathlib. Without the Mathlib cache this job would
      # compile Mathlib from source.
      - name: Build Lean library
        uses: leanprover/lean-action@v1
        with:
          build: "true"
          use-mathlib-cache: "auto"
          build-args: "--wfail"
