#
# Packaging metadata. The repository is a research workbench first, but the module
# tree is a normal package: `pip install .` puts `riemann_framework` on the path
# with the dependencies the modules actually import. The version has a single
# source, `python/riemann_framework/__init__.py`, and `tests/test_packaging.py`
# checks that this file agrees with it, that every third-party import is declared
# somewhere below, and that the licence here matches LICENSE.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riemann-framework"
description = "A research workbench for the Riemann hypothesis: measured limits, negative results, and the code that produces them"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Milan Nikolic", email = "m_nikolic@yahoo.com" }]
keywords = ["riemann-hypothesis", "random-matrix-theory", "spectral-statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
#: The modules import these three unconditionally; matplotlib is only needed for the
#: plotting modules, so it is an extra rather than a dependency.
dependencies = ["numpy>=1.26", "mpmath>=1.3", "scipy>=1.10"]
dynamic = ["version"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
tests = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/mixic/riemann-framework"
Documentation = "https://github.com/mixic/riemann-framework#readme"

[tool.setuptools]
packages = ["riemann_framework"]

[tool.setuptools.package-dir]
riemann_framework = "python/riemann_framework"

[tool.setuptools.dynamic]
version = { attr = "riemann_framework.__version__" }
